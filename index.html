<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="icon" type="image/png" href="favicon.png"/><title>WASM Postflop - Free GTO Solver for Web Browser</title><script>// Static hosts (e.g. GitHub Pages) cannot send COOP/COEP headers, which
      // are required for `SharedArrayBuffer` and the multi-threaded WASM build.
      // coi-serviceworker injects those headers for every response; reload once
      // it takes control so the page starts cross-origin isolated.
      (function () {
        if (!("serviceWorker" in navigator) || window.crossOriginIsolated) {
          return;
        }
        navigator.serviceWorker
          .register("coi-serviceworker.min.js")
          .catch(function (error) {
            console.error(
              "COOP/COEP service worker registration failed:",
              error
            );
          });
        var reloaded = false;
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          function () {
            if (reloaded) {
              return;
            }
            reloaded = true;
            window.location.reload();
          }
        );
      })();</script><script defer="defer" src="246418cc99f92308baaf.js"></script><link href="c8bfe643b639c84b1a16.css" rel="stylesheet"></head><body><div id="app"></div></body></html>
